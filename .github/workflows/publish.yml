name: Publish to npm and MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Nothing is built or published until the full suite, the race detector, vet
  # and gofmt have passed. A release must never ship code that was not tested.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # The npm package installs the release matching its own version, so a
      # tag must carry the package.json version. Off a tag (a dry run), the
      # package.json version is used.
      - name: Resolve version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "${VERSION}" != "${PACKAGE_VERSION}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}"
              exit 1
            fi
          else
            VERSION="${PACKAGE_VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # Archive names come from scripts/install.js, the npm installer that
      # downloads them, so the two cannot drift apart.
      - name: Build binary and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          TARGET="{goos: '${GOOS}', goarch: '${GOARCH}'}"
          BINARY="$(node -p "require('./scripts/install.js').archiveBinaryName(${TARGET})")"
          ASSET="$(node -p "require('./scripts/install.js').releaseAssetName('${VERSION}', ${TARGET})")"
          go build -ldflags "-X main.version=${VERSION}" -o "dist/${BINARY}" .
          tar -czf "dist/${ASSET}" -C dist "${BINARY}"
          echo "BINARY=${BINARY}" >> "$GITHUB_ENV"
          echo "SBOM=${ASSET%.tar.gz}.spdx.json" >> "$GITHUB_ENV"
          echo "Built ${ASSET}"

      # Syft reads the module list Go embeds in the binary, so each platform's
      # SBOM lists exactly the modules linked into that binary.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          file: dist/${{ env.BINARY }}
          format: spdx-json
          output-file: dist/${{ env.SBOM }}
          upload-artifact: false
          upload-release-assets: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.spdx.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # scripts/install.js refuses any archive whose SHA-256 is not listed here.
      - name: Write checksums
        working-directory: release
        run: |
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: release/checksums.txt

      - name: Keep dry-run release files
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/*.spdx.json
            release/checksums.txt
          generate_release_notes: true

      # The package is the launcher and installer only; its postinstall
      # downloads the binary from the release created above.
      - name: Publish to npm (dry run)
        if: inputs.dry_run
        run: npm publish --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
