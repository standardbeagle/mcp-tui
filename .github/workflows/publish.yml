name: Publish to npm and MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: 'false'
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          BINARY_NAME="mcp-tui-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o "dist/${BINARY_NAME}" .
          echo "Built ${BINARY_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare binaries for npm package
        run: |
          mkdir -p bin
          # Copy linux-amd64 as the default binary for npm
          cp artifacts/binary-linux-amd64/mcp-tui-linux-amd64 bin/mcp-tui
          chmod +x bin/mcp-tui

          # Also build a local binary for the current platform
          go build -o bin/mcp-tui-local .

          ls -la bin/

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/binary-*; do
            for file in "$dir"/*; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                cp "$file" "release/${filename}"
                chmod +x "release/${filename}" 2>/dev/null || true
              fi
            done
          done

          # Create tarballs for each platform
          cd release
          for binary in mcp-tui-*; do
            if [ -f "$binary" ]; then
              platform="${binary#mcp-tui-}"
              platform="${platform%.exe}"
              tar -czvf "mcp-tui_${GITHUB_REF_NAME#v}_${platform}.tar.gz" "$binary"
            fi
          done
          ls -la

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (dry run)
        if: inputs.dry_run == 'true'
        run: npm publish --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: inputs.dry_run != 'true' && startsWith(github.ref, 'refs/tags/')
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
