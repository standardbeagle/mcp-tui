name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Tags are covered by publish.yml, which calls this workflow before releasing.
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  vet:
    name: Vet and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^vendor/' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # golangci-lint v2.13.2 needs Go >= 1.26 to build; the module itself
      # still targets 1.25.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Same pinned version and invocation as `tman lint` and `make lint`,
      # configured by .golangci.yml.
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Tests that need a child process spawn PowerShell 7 (pwsh), which is
    # preinstalled on all three runner images. Requiring it here means a missing
    # pwsh fails the job rather than silently skipping the cross-platform tests.
    env:
      MCP_TUI_REQUIRE_PWSH: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Several integration tests shell out to an MCP server via npx.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: go test
        run: go test ./... -timeout 15m

  race:
    name: Race detector
    runs-on: ubuntu-latest
    env:
      MCP_TUI_REQUIRE_PWSH: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The concurrency-sensitive code lives under internal/mcp and internal/tui.
      - name: go test -race
        run: go test -race ./internal/... -timeout 20m

  # Reports vulnerabilities reachable from mcp-tui's code in its modules and
  # in the standard library of the Go it is released with. govulncheck checks
  # the stdlib of the go it runs with, so it runs on 1.25 here. It is pinned
  # to x/vuln v1.7.0, the last release that builds on Go 1.25; @latest (as
  # golang/govulncheck-action installs it) needs Go 1.26 and fails to install.
  # The vulnerability database is fetched fresh on every run either way.
  govulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # The npm installer runs on every user platform, and extracts with whatever
  # tar the platform has, so it is tested on all three.
  npm-installer:
    name: npm installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node --test
        run: node --test scripts/install.test.js

  build:
    name: Cross-platform build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
