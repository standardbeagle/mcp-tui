version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - bodyclose
    - dupl
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - lll
    - misspell
    - nakedret
    - prealloc
    - unconvert
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable:
        - shadow
    gocyclo:
      min-complexity: 15
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
    misspell:
      locale: US
      # MCP spells these on the wire (notifications/cancelled, task status
      # "cancelled"); Go identifiers and docs must match the spec.
      ignore-rules:
        - cancelled
    lll:
      line-length: 120
    gocritic:
      enabled-tags:
        - performance
        - style
        - experimental
      disabled-checks:
        - wrapperFunc
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      # SEP-2577 deprecated roots/sampling/logging in protocol 2026-07-28, but
      # they stay functional for at least a twelve-month window and mcp-tui is
      # a test client whose job includes exercising them. Only go-sdk symbols
      # are excluded; deprecations from anywhere else still report.
      - linters:
          - staticcheck
        text: 'SA1019: .*github\.com/modelcontextprotocol/go-sdk/mcp\.'
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - gocognit
          - goconst
          - gocyclo
          - gosec
          - lll

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/standardbeagle/mcp-tui

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
